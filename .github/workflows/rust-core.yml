name: Rust fixture core

on:
  push:
    branches: [main, "codex/**"]
    paths: ["core/**", ".github/workflows/rust-core.yml"]
  pull_request:
    branches: [main]
    paths: ["core/**", ".github/workflows/rust-core.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abi-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' core/rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
      - name: Check formatting and Rust/C ownership contract
        run: |
          (cd core && cargo fmt --check)
          sh core/test-ffi.sh
      - name: Install debugger on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdb
      - name: Check source-level ABI debugging on Linux
        if: runner.os == 'Linux'
        run: |
          gdb --batch -ex 'set pagination off' -ex 'break suizai_fixture_read' -ex run -ex bt -ex 'info args' core/target/ffi_smoke | tee core/target/debugging.txt
          grep -q 'Breakpoint 1,.*suizai_fixture_read' core/target/debugging.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: rust-abi-debugging
          path: core/target/debugging.txt
          if-no-files-found: warn
          retention-days: 14
