name: Publish Android PoC

on:
  push:
    tags: ["android-poc-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-poc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/android-poc-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate immutable test version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^android-poc-v[0-9]+\.[0-9]+\.[0-9]+-poc\.[0-9]{8}\.[0-9]+$ ]] || exit 1
          echo "value=${TAG#android-poc-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install project SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Test and build APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Prepare test handoff
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/suizai-${VERSION}.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "dist/suizai-${VERSION}-androidTest.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat > dist/TESTING.md <<EOF
          # SUIZAI Android Phase 0 test build

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          CI: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Install suizai-${VERSION}.apk on an Android 8.0+ test device.
          The androidTest APK is optional and only for the instrumentation suite.
          This is a debug-signed local mock, not a production release. Use disposable,
          non-sensitive files. There are no remote accounts, cloud providers or root helpers.
          Each CI build uses an ephemeral debug key; upgrading an older build can require
          uninstalling it, which deletes its mock data. Preserve needed fixtures first.

          Device/BOOK☆WALKER compatibility, reboot and lifecycle behavior are pending.
          Follow docs/android-phase0-runbook.md and docs/apk-distribution.md at this tag:
          https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}/docs
          Report model, OS build, this version/checksum, exact steps and results in issue #1.
          BOOK☆WALKER tests additionally require a dedicated account and replaceable content.

          Packages coordinate: tw.suizai:suizai-android-poc:${VERSION}:apk
          The package contains the same application APK as this Release.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: suizai-android-poc-${{ steps.version.outputs.value }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to GitHub Packages (Maven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mvn --batch-mode org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY,,}" \
            -DgroupId=tw.suizai \
            -DartifactId=suizai-android-poc \
            -Dversion="$VERSION" \
            -Dpackaging=apk \
            -Dfile="dist/suizai-${VERSION}.apk" \
            -DgeneratePom=true \
            -Ddescription="SUIZAI Phase 0 local mock Android test APK"

      - name: Publish prerelease and download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --prerelease \
            --title "Android Phase 0 ${VERSION}" --notes-file dist/TESTING.md
          {
            echo "## Android test handoff"
            echo "[Download APK and checklist](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo ""
            echo "Packages: tw.suizai:suizai-android-poc:${VERSION}:apk"
            echo ""
            echo "Device validation is pending; this is not a production release."
          } >> "$GITHUB_STEP_SUMMARY"
